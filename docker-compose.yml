---
version: '3'
services:

  #-------------------------------------------------------------------
  # intellireading-www is a nginx server that serves static files
  intellireading-www: 
    container_name: intellireading-www
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: "no"
    volumes:
      - ./log:/var/log/www
      - ./dist:/usr/share/nginx/html
    image: intellireading-www
    ports:
      - 8080:8080
