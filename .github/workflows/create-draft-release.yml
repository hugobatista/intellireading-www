---
name: create_draft_release
# yamllint disable rule:line-length

on:
  workflow_dispatch:

# set the run-name 
run-name: ${{ github.ref_name }} -> create_draft_release (
  ${{ github.run_attempt }}
  )
    

jobs:
    
  create_draft_release:
    name: create_draft_release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:

    - name: Echo current date and time
      id: datetime
      run: |
        echo "datetime: $(date '+%Y-%m-%d %H:%M:%S')"

    - name: Checkout
      uses: actions/checkout@v6.0.2

    - name: Get version from package.json
      id: version
      run: echo "version=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"

    # validates that the version is a valid semver
    - name: Validate version
      run: |
        version="${{ steps.version.outputs.version }}"
        if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid version: $version"
          exit 1
        fi

    - name: Check release tag does not already exist
      run: |
        tag="v${{ steps.version.outputs.version }}"
        if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
          echo "Tag $tag already exists on origin. Has this version already been released?"
          exit 1
        fi

    - name: Create release branch
      run: |
        git checkout -b "release/v${{ steps.version.outputs.version }}"
        git push origin "release/v${{ steps.version.outputs.version }}"

    - name: Create DRAFT release through GitHub CLI
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "v${{ steps.version.outputs.version }}" \
          --title "v${{ steps.version.outputs.version }}" \
          --generate-notes \
          --draft
