---
name: deploy_to_cloudflare
# yamllint disable rule:line-length

on:
  release:
    types: [released]
  workflow_dispatch:


# set the run-name 
run-name: ${{ github.ref_name }} -> deploy_to_cloudflare (
  ${{ github.run_attempt }}
  )


jobs:
  deploy_to_cloudflare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: deploy_to_cloudflare
    environment: production
    concurrency: production
    steps:
      - name: Echo current date and time
        id: datetime
        run: |
          echo "datetime: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: Checkout
        uses: actions/checkout@v3.6.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUFLARE_EDIT_PAGES_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: www-intellireading
          directory: dist
          branch: main
          # Optional: Change the Wrangler version, allows you to point to 
          # a specific version or a tag such as `beta`
          wranglerVersion: '3'
